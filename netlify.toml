[build]
  publish = "."

[[edge_functions]]
  path = "/*"
  function = "genetics-ssr"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Content-Type = "image/x-icon"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

# Clean URL for privacy page
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# Redirect Netlify subdomain to custom domain
[[redirects]]
  from = "https://lovebird-genetics.netlify.app/*"
  to = "https://lovebirdgenetics.com/:splat"
  status = 301
  force = true
