<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Page Not Found — Lovebird Genetics Calculator</title>
<meta name="robots" content="noindex,follow"/>
<link rel="icon" type="image/x-icon" href="/favicon.ico"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<!-- Read theme before paint to avoid flash -->
<script>(function(){var t=localStorage.getItem('lb-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg-page:#f7f7f5;
  --text-1:#0a0a0a;
  --text-2:#4a4a4a;
  --text-3:#888;
  --bg-icon:#141414;
  --accent:#4ca154;
}
[data-theme="dark"]{
  --bg-page:#080808;
  --text-1:#f0f0ee;
  --text-2:#a0a09a;
  --text-3:#606060;
  --bg-icon:#1a1a1a;
}
html,body{height:100%;}
body{
  font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg-page);
  color:var(--text-1);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:24px;
  -webkit-font-smoothing:antialiased;
  transition:background 0.2s,color 0.2s;
}
.wrap{
  text-align:center;
  max-width:480px;
  width:100%;
}
.logo{
  display:inline-flex;
  align-items:center;
  gap:12px;
  margin-bottom:48px;
  text-decoration:none;
}
.logo-icon{
  background:var(--bg-icon);
  border-radius:14px;
  padding:8px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.logo-name{font-size:15px;font-weight:700;color:var(--text-1);letter-spacing:-0.02em;line-height:1.2;text-align:left;}
.logo-sub{font-size:11px;color:var(--text-3);font-weight:500;margin-top:2px;}
.code{
  font-size:96px;
  font-weight:800;
  color:var(--accent);
  letter-spacing:-0.06em;
  line-height:1;
  margin-bottom:16px;
}
h1{
  font-size:24px;
  font-weight:700;
  color:var(--text-1);
  letter-spacing:-0.03em;
  margin-bottom:10px;
}
p{
  font-size:15px;
  color:var(--text-2);
  line-height:1.6;
  margin-bottom:36px;
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--accent);
  color:#fff;
  font-family:'DM Sans',sans-serif;
  font-size:15px;
  font-weight:700;
  text-decoration:none;
  border-radius:14px;
  padding:14px 28px;
  letter-spacing:-0.01em;
  transition:opacity 0.2s;
}
.btn:hover{opacity:0.88;}
</style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="/">
    <div class="logo-icon">
      <img src="/logo-icon.svg" width="28" height="28" alt=""/>
    </div>
    <div>
      <div class="logo-name">Lovebird Genetics</div>
      <div class="logo-sub">by KinBird Aviary</div>
    </div>
  </a>

  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>This page doesn't exist or may have moved.<br>The calculator is right where you left it.</p>

  <a class="btn" href="/">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Back to Calculator
  </a>
</div>
</body>
</html>
